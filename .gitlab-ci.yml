# Run on merge requests and on main, without duplicate pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [quality, test, build, image]

default:
  image: node:24-alpine
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

format:
  stage: quality
  script: pnpm format:check

lint:
  stage: quality
  script: pnpm lint

typecheck:
  stage: quality
  script: pnpm typecheck

test:
  stage: test
  script: pnpm --filter @partyverse/server test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/server/coverage/cobertura-coverage.xml

build-web:
  stage: build
  script: pnpm --filter @partyverse/web build

build-server:
  stage: build
  script: pnpm --filter @partyverse/server build

# Docker image builds — main only until the self-hosted runner has privileged DinD.
# (MR DinD was hanging forever on: Cannot connect to the Docker daemon at tcp://docker:2375)
docker-server:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  timeout: 5m
  allow_failure: true
  before_script:
    - |
      i=0
      until docker info; do
        i=$((i + 1))
        if [ "$i" -ge 30 ]; then echo "DinD not ready"; exit 1; fi
        sleep 2
      done
  script:
    - docker build -f apps/server/Dockerfile -t partyverse-server:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-web:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  timeout: 5m
  allow_failure: true
  before_script:
    - |
      i=0
      until docker info; do
        i=$((i + 1))
        if [ "$i" -ge 30 ]; then echo "DinD not ready"; exit 1; fi
        sleep 2
      done
  script:
    - docker build -f apps/web/Dockerfile -t partyverse-web:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
