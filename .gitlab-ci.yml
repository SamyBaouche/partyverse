# Run on merge requests and on main, without duplicate pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [quality, test, build, image, deploy]

default:
  image: node:24-alpine
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

format:
  stage: quality
  script: pnpm format:check

lint:
  stage: quality
  script: pnpm lint

typecheck:
  stage: quality
  script: pnpm typecheck

test:
  stage: test
  script: pnpm --filter @partyverse/server test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/server/coverage/cobertura-coverage.xml
    paths:
      - apps/server/coverage/

build-web:
  stage: build
  script: pnpm --filter @partyverse/web build

build-server:
  stage: build
  script: pnpm --filter @partyverse/server build

# #25 — Kaniko push (no privileged DinD required on the self-hosted runner)
.kaniko:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json

kaniko-server:
  extends: .kaniko
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/apps/server/Dockerfile" \
        --custom-platform=linux/amd64 \
        --destination "${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}/server:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

kaniko-web:
  extends: .kaniko
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/apps/web/Dockerfile" \
        --custom-platform=linux/amd64 \
        --destination "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}/web:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# #36 / #61 — Trivy filesystem + IaC config scan (no DinD / no registry pull required)
trivy:
  stage: image
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  before_script: []
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .
    - trivy config --severity HIGH,CRITICAL --exit-code 1 infra
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
  artifacts:
    when: always
    paths:
      - .trivycache/
    expire_in: 1 day

# Sprint 4 — Bicep what-if on MRs (needs AZURE_* CI variables / OIDC later — ADR 0009)
bicep-what-if:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.67.0
  before_script: []
  script:
    - az bicep build --file infra/main.bicep
    - |
      if [ -z "${AZURE_CLIENT_ID:-}" ]; then
        echo "AZURE_* not configured yet — Bicep compile-only (OIDC deploy is #37)."
        exit 0
      fi
      az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      az deployment group what-if \
        --resource-group "${AZURE_RESOURCE_GROUP:-partyverse-rg}" \
        --template-file infra/main.bicep \
        --parameters infra/main.bicepparam
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Record pipeline duration hint for metric Y (docs/metrics.md)
measure-pipeline:
  stage: deploy
  image: alpine:3.20
  before_script: []
  script:
    - echo "Pipeline ${CI_PIPELINE_ID} commit ${CI_COMMIT_SHORT_SHA} — paste duration from GitLab UI into docs/metrics.md as Y"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
